{% extends 'base.html' %}
{% block title %}Remove member{% endblock %}
{% block content %}
<div class="max-w-md mx-auto card card-pad">
  <h1 class="text-2xl font-bold mb-2">Remove {{ m.user.email }}?</h1>
  <p class="muted text-sm mb-6">They lose access to {{ company.name }}. Their submissions, reviews and history stay on record.</p>
  <form method="post" class="flex gap-2" data-once>{% csrf_token %}
    <button class="btn btn-danger" type="submit">Remove member</button>
    <a class="btn btn-ghost" href="{% url 'qr_app:manage_team' company.slug %}">Cancel</a>
  </form>
</div>
{% endblock %}
