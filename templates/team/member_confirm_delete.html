{% extends 'base.html' %}
{% block title %}Remove member{% endblock %}
{% block content %}
<div class="max-w-lg">
  <a class="back-link" href="{% url 'qr_app:manage_team' company.slug %}">Team</a>
  <section class="panel panel-pad">
    <h1 class="text-2xl">Remove {{ m.user.email }}?</h1>
    <p class="muted mt-2">They lose access to {{ company.name }}. Their measurements, submissions, reviews and history stay on record.</p>
    <form method="post" class="form-actions mt-5" data-once data-pending="Removing member">{% csrf_token %}
      <button class="btn btn-danger" type="submit">Remove member</button>
      <a class="btn btn-ghost" href="{% url 'qr_app:manage_team' company.slug %}">Cancel</a>
    </form>
  </section>
</div>
{% endblock %}
