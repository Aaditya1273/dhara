{% extends 'base.html' %}
{% block title %}Something went wrong{% endblock %}
{% block content %}
<div class="max-w-lg mx-auto card card-pad text-center">
  <p class="eyebrow">Error 500</p>
  <h1 class="text-2xl font-bold my-2">Something went wrong</h1>
  <p class="muted">The error has been logged. Please try again.</p>
  {% if error_id %}<p class="mono mt-4">Reference: {{ error_id }}</p>{% endif %}
  <a class="btn btn-ghost mt-6" href="/">Go to start</a>
</div>
{% endblock %}
