<script>
// DHARA, 75 s. Every frame is a pure function of time t (seek). Google four-colour system on white.
const W = 1920, H = 1080, g = document.getElementById('c').getContext('2d');
const K = { blue: '#4285F4', red: '#EA4335', yellow: '#FBBC05', green: '#34A853', ink: '#202124', grey: '#5F6368', line: '#DADCE0', soft: '#F8F9FA', pale: '#E8F0FE' };

// ---- primitives ----
function T(s, x, y, { size = 40, w = 600, color = K.ink, align = 'left', a = 1, ls = 0, mono = false } = {}) {

}
function width(s, size, w = 600, ls = 0, mono = false) { g.save(); g.font = `${w} ${size}px ${mono ? 'Mono' : 'Inter'}`; g.letterSpacing = ls + 'px'; const v = g.measureText(s).width; g.restore(); return v; }
// Masked word reveal (words rise from a baseline mask); colors per word optional.

    if (p > 0) { g.save(); g.beginPath(); g.rect(cx - 8, y - size * 1.0, wd[i] + 16, size * 1.3); g.clip(); T(v, cx, y + (1 - p) * size * 1.05 - q * size * 1.1, { size, w, color: colors[i] || color, ls }); g.restore(); }
    cx += wd[i] + sp;
  });

}
const rr = (x, y, w, h, r) => { g.beginPath(); g.roundRect(x, y, w, h, r); };
function shadowCard(x, y, w, h, r = 24, fill = '#fff', sh = 0.10) { g.save(); g.shadowColor = `rgba(32,33,36,${sh})`; g.shadowBlur = 40; g.shadowOffsetY = 14; rr(x, y, w, h, r); g.fillStyle = fill; g.fill(); g.restore(); g.save(); rr(x + 0.5, y + 0.5, w - 1, h - 1, r); g.strokeStyle = K.line; g.lineWidth = 1; g.stroke(); g.restore(); }

function dots(cx, cy, r, gap, a = 1, p = 1) { [K.blue, K.red, K.yellow, K.green].forEach((c, i) => { const q = eout5(prog(p, i * 0.08, 0.6 + i * 0.08)); g.save(); g.globalAlpha *= a * q; g.beginPath(); g.arc(cx + (i - 1.5) * gap, cy + (1 - q) * 30, r, 0, Math.PI * 2); g.fillStyle = c; g.fill(); g.restore(); }); }

  g.beginPath(); g.moveTo(0, 0); g.lineTo(0, 21); g.lineTo(5.2, 16.2); g.lineTo(9, 24.8); g.lineTo(12.6, 23.3); g.lineTo(8.8, 14.9); g.lineTo(15.4, 14.9); g.closePath(); g.fillStyle = K.ink; g.fill(); g.shadowColor = 'transparent'; g.lineWidth = 1.5; g.strokeStyle = '#fff'; g.stroke(); g.restore(); }
function cursorPos(t, pts) { // pts: [[t0,x,y],...] moves start at t_i, take dur_i (default 0.5)

// Product window and camera (page CSS px, 1280 wide)
const WIN = { x: 200, y: 92, w: 1520, h: 855 + 40 };

const lerpBox = (a, b, p) => a.map((v, i) => lerp(v, b[i], p));
function bg() { g.fillStyle = '#fff'; g.fillRect(0, 0, W, H); }

let TL, S, D, SEC;
const IMG = {}, LIVE = {};
const load = (n, src) => new Promise((r) => { const i = new Image(); i.onload = () => { IMG[n] = i; r(); }; i.onerror = r; i.src = src; });
window.ready = (async () => {

  ['dashboard', 'priority', 'event', 'verified', 'event_filled', 'accepted', 'followups'].forEach((n) => jobs.push(load('p5_' + n, 'cap/p5/' + n + '.jpg')));
  ['t2_form0', 't2_type1', 't2_type2', 't2_type3', 't2_type4', 'p1_public'].forEach((n) => jobs.push(load(n, 'cap/product/' + n + '.jpg')));

// our mark: four black dots in a rhombus
function rhombus(cx, cy, r, gap, a = 1, p = 1, col = K.ink) {
  [[0, -1], [1, 0], [0, 1], [-1, 0]].forEach(([dx, dy], i) => { const q = eout5(prog(p, i * 0.09, 0.55 + i * 0.09)); if (q <= 0) return;
    g.save(); g.globalAlpha *= a * q; g.beginPath(); g.arc(cx + dx * gap * lerp(1.6, 1, q), cy + dy * gap * lerp(1.6, 1, q), r * q, 0, Math.PI * 2); g.fillStyle = col; g.fill(); g.restore(); });
}
function kenBurns(name, x, y, w, h, t, { z0 = 1.08, z1 = 1.22, fx = 0.5, fy = 0.5, r = 28, a = 1, dx = 0 } = {}) {

}
function credit(s, x, y, a = 1) { T(s, x, y, { size: 15, w: 500, color: K.grey, a: a * 0.9 }); }

const sec = (i) => SEC[i];

// ===== A. HOOK =====

  }

    T('the residual keeps protecting the water downstream', 120, 830, { size: 26, w: 500, color: K.grey }); g.restore();
