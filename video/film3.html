<html><head><meta charset="utf-8"><title>DHARA film</title>
<style>

@font-face { font-family: 'Serif'; src: url('../static/fonts/instrument-serif.woff2') format('woff2'); }

<body><canvas id="c" width="1920" height="1080"></canvas>
<script>
// Every frame is a pure function of time: seek(t) draws the whole film at t seconds.
const W = 1920, H = 1080, cv = document.getElementById('c'), g = cv.getContext('2d');
const C = { blue: '#0866F5', sky: '#3B82F6', light: '#93C5FD', pale: '#EAF3FF', navy: '#0B1222', ink: '#04070C',
  white: '#FFFFFF', muted: '#94A3B8', dim: '#64748B', teal: '#14B8A6', heat: '#F59E0B', red: '#EF4444', paper: '#FBF7EC' };
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const eio = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
const eout = (t) => 1 - Math.pow(1 - t, 3);
const eout5 = (t) => 1 - Math.pow(1 - t, 5);
const ein = (t) => t * t * t;
function spring(t, w = 16, z = 0.72) { if (t <= 0) return 0; const wd = w * Math.sqrt(1 - z * z); return 1 - Math.exp(-z * w * t) * (Math.cos(wd * t) + (z * w / wd) * Math.sin(wd * t)); }
function rng(seed) { return () => { seed |= 0; seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

// ---------- assets ----------
const IMG = {};
const WOKWI = [];
function load(name, src) { return new Promise((res) => { const i = new Image(); i.onload = () => { IMG[name] = i; res(); }; i.onerror = () => res(); i.src = src; }); }
window.ready = (async () => {
  const P = 'cap/product/';
  const names = ['t2_form0', 't2_type1', 't2_type2', 't2_type3', 't2_type4', 'w1_dashboard', 'w2_priority', 'w3_tank', 'w35_queue', 'w4_event', 'p1_public'];
  const jobs = names.map((n) => load(n, P + n + '.jpg'));
  jobs.push(load('hero', '../static/img/hero-1672.webp'));
  const wk = await fetch('cap/wokwi/list.json').then((r) => r.json());
  wk.forEach((f) => { const ms = parseInt(f.slice(2, 8), 10); WOKWI.push({ ms, name: 'wk' + ms }); jobs.push(load('wk' + ms, 'cap/wokwi/' + f)); });
  window.PROOF = await fetch('cap/proof.json').then((r) => r.json());
  window.TL = await fetch('timeline.json').then((r) => r.json()); buildScenes();
  await Promise.all(jobs);
  await document.fonts.load('600 40px Inter'); await document.fonts.load('40px Serif'); await document.fonts.load('20px Mono');
  return true;
})();

// ---------- drawing helpers ----------
function font(size, weight = 600, fam = 'Inter') { g.font = `${weight} ${size}px ${fam === 'Inter' ? 'Inter' : fam}`; }
function text(s, x, y, { size = 40, weight = 600, fam = 'Inter', color = '#0F172A', align = 'left', alpha = 1, ls = 0, base = 'alphabetic' } = {}) {
  if (alpha <= 0) return; g.save(); g.globalAlpha *= alpha; font(size, weight, fam); g.fillStyle = color; g.textAlign = align; g.textBaseline = base;
  g.letterSpacing = ls + 'px'; g.fillText(s, x, y); g.restore();
}
// Words rise out of a mask line, one after another.
function rise(s, x, y, t, { size = 72, weight = 650, fam = 'Inter', color = '#0F172A', align = 'left', stagger = 0.07, dur = 0.7, ls = -1, colors = null } = {}) {
  font(size, weight, fam); g.letterSpacing = ls + 'px';
  const words = s.split(' '), sp = g.measureText(' ').width, ws = words.map((w) => g.measureText(w).width);
  const total = ws.reduce((a, b) => a + b, 0) + sp * (words.length - 1);
  let cx = align === 'center' ? x - total / 2 : align === 'right' ? x - total : x;
  words.forEach((w, i) => {
    const p = eout5(prog(t, i * stagger, i * stagger + dur));
    if (p > 0) {
      g.save(); g.beginPath(); g.rect(cx - 10, y - size * 1.05, ws[i] + 20, size * 1.35); g.clip();
      text(w, cx, y + (1 - p) * size * 1.1, { size, weight, fam, color: colors ? colors[i] || color : color, ls, alpha: clamp(p * 1.4) });
      g.restore();
    }
    cx += ws[i] + sp;
  });
}
function rr(x, y, w, h, r) { g.beginPath(); g.roundRect(x, y, w, h, r); }
function dropPath(cx, cy, r, stretch = 1) {
  g.beginPath(); const top = cy - r * 2.1 * stretch;
  g.moveTo(cx, top);
  g.bezierCurveTo(cx + r * 0.25, top + r * 0.9 * stretch, cx + r, cy - r * 0.55, cx + r, cy);
  g.arc(cx, cy, r, 0, Math.PI, false);
  g.bezierCurveTo(cx - r, cy - r * 0.55, cx - r * 0.25, top + r * 0.9 * stretch, cx, top);
  g.closePath();
}
function drawDrop(cx, cy, r, stretch = 1, alpha = 1) {
  g.save(); g.globalAlpha = alpha; dropPath(cx, cy, r, stretch);
  const gr = g.createLinearGradient(cx - r, cy - r * 2, cx + r, cy + r); gr.addColorStop(0, '#9CC8FF'); gr.addColorStop(0.5, C.blue); gr.addColorStop(1, '#0646B8');
  g.fillStyle = gr; g.fill();
  g.beginPath(); g.ellipse(cx - r * 0.38, cy - r * 0.15, r * 0.16, r * 0.34, -0.4, 0, Math.PI * 2); g.fillStyle = 'rgba(255,255,255,.75)'; g.fill();
  g.restore();
}
function logo(cx, cy, s, alpha = 1) { // the DHARA drop with two white waves
  g.save(); g.globalAlpha = alpha; g.translate(cx, cy); g.scale(s / 32, s / 32); g.translate(-16, -16);
  g.beginPath(); g.moveTo(16, 3.5); g.bezierCurveTo(16, 3.5, 7.5, 13.1, 7.5, 19.1); g.arc(16, 19.1, 8.5, Math.PI, 0, true);
  g.bezierCurveTo(24.5, 13.1, 16, 3.5, 16, 3.5); g.closePath(); g.fillStyle = C.blue; g.fill();
  g.strokeStyle = '#fff'; g.lineWidth = 1.7; g.lineCap = 'round';
  [19.6, 23.2].forEach((y, i) => { g.globalAlpha = alpha * (i ? 0.55 : 1); g.beginPath(); g.moveTo(11.2, y); g.bezierCurveTo(12.8, y - 1.3, 14.4, y - 1.3, 16, y); g.bezierCurveTo(17.6, y + 1.3, 19.2, y + 1.3, 20.8, y); g.stroke(); });
  g.restore();
}
function bg(top, bottom) { const gr = g.createLinearGradient(0, 0, 0, H); gr.addColorStop(0, top); gr.addColorStop(1, bottom); g.fillStyle = gr; g.fillRect(0, 0, W, H); }
function vignette(a = 0.55) { return; const gr = g.createRadialGradient(W / 2, H / 2, H * 0.35, W / 2, H / 2, H * 0.95); gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(1, `rgba(0,0,0,${a})`); g.fillStyle = gr; g.fillRect(0, 0, W, H); }
function grain(t, a = 0.035) { const r = rng(Math.floor(t * 30) + 7); g.save(); g.globalAlpha = a; g.fillStyle = '#fff'; for (let i = 0; i < 900; i++) g.fillRect(r() * W, r() * H, 1.5, 1.5); g.restore(); }
function chip(s, x, y, { color = C.blue, fg = '#fff', size = 22, alpha = 1, dot = true } = {}) {
  if (alpha <= 0) return; g.save(); g.globalAlpha = alpha; font(size, 650); g.letterSpacing = '1.5px';
  const w = g.measureText(s).width + (dot ? 56 : 36); rr(x, y, w, size * 2, size); g.fillStyle = color; g.fill();
  if (dot) { g.beginPath(); g.arc(x + 24, y + size, 6, 0, Math.PI * 2); g.fillStyle = fg; g.fill(); }
  text(s, x + (dot ? 40 : 18), y + size * 1.36, { size, weight: 650, color: fg, ls: 1.5 }); g.restore(); return w;
}
function windowFrame(x, y, w, h, { alpha = 1, bar = 44, title = '', dark = false } = {}) {
  g.save(); g.globalAlpha = alpha;
  g.shadowColor = 'rgba(0,0,0,.45)'; g.shadowBlur = 80; g.shadowOffsetY = 30; rr(x, y, w, h, 22); g.fillStyle = dark ? '#0E1525' : '#fff'; g.fill();
  g.shadowColor = 'transparent'; rr(x, y, w, bar, [22, 22, 0, 0]); g.fillStyle = dark ? '#131C30' : '#F1F5F9'; g.fill();
  ['#FF5F57', '#FEBC2E', '#28C840'].forEach((c, i) => { g.beginPath(); g.arc(x + 26 + i * 22, y + bar / 2, 7, 0, Math.PI * 2); g.fillStyle = c; g.fill(); });
  if (title) { font(18, 600, 'Mono'); const tw = g.measureText(title).width + 32; rr(x + w / 2 - tw / 2, y + 9, tw, bar - 18, 13); g.fillStyle = C.blue; g.fill(); text(title, x + w / 2, y + bar / 2 + 6, { size: 17, weight: 600, fam: 'Mono', color: '#fff', align: 'center' }); }
  g.restore();
}
function cursor(x, y, press = 0, alpha = 1) {
  g.save(); g.globalAlpha = alpha; g.translate(x, y); const s = 1.7 * (1 - press * 0.16); g.scale(s, s);
  g.shadowColor = 'rgba(0,0,0,.35)'; g.shadowBlur = 8; g.shadowOffsetY = 3;
  g.beginPath(); g.moveTo(0, 0); g.lineTo(0, 22); g.lineTo(5.5, 17); g.lineTo(9.5, 26); g.lineTo(13, 24.5); g.lineTo(9, 16); g.lineTo(16, 16); g.closePath();
  g.fillStyle = '#0B0F19'; g.fill(); g.shadowColor = 'transparent'; g.lineWidth = 1.6; g.strokeStyle = '#fff'; g.stroke(); g.restore();
}
function clickRing(x, y, p) { if (p <= 0 || p >= 1) return; g.save(); g.globalAlpha = (1 - p) * 0.8; g.strokeStyle = C.blue; g.lineWidth = 3; g.beginPath(); g.arc(x, y, 10 + eout(p) * 34, 0, Math.PI * 2); g.stroke(); g.restore(); }
function track(t, keys) { // piecewise eased keyframes [[time, value], ...]
  if (t <= keys[0][0]) return keys[0][1];
  for (let i = 1; i < keys.length; i++) { const [t1, v1] = keys[i], [t0, v0] = keys[i - 1]; if (t <= t1) { const p = eio(prog(t, t0, t1)); return Array.isArray(v0) ? v0.map((v, j) => lerp(v, v1[j], p)) : lerp(v0, v1, p); } }
  return keys[keys.length - 1][1];
}

// ---------- scenes (start, end, draw(local t)) ----------
const SCENES = [];
const scene = (a, b, fn) => SCENES.push({ a, b, fn });

const OLD = {};
// S4 ARCHITECTURE: probe -> AWS IoT Core -> rules -> DHARA on EC2 + S3 archive. The camera follows the message.
const NODES = { probe: [330, 540], iot: [960, 540], ec2: [1580, 330], s3: [1580, 760] };
function node(k, label, sub, p, kind) {
  const [x, y] = NODES[k]; if (p <= 0) return; g.save(); g.globalAlpha = p; g.translate(x, y); const s = lerp(0.85, 1, eout(p)); g.scale(s, s);
  g.shadowColor = 'rgba(15,23,42,.12)'; g.shadowBlur = 36; g.shadowOffsetY = 14; rr(-170, -110, 340, 220, 30); g.fillStyle = '#fff'; g.fill(); g.shadowColor = 'transparent'; g.strokeStyle = k === 'iot' ? C.blue : 'rgba(15,23,42,.10)'; g.lineWidth = k === 'iot' ? 3 : 2; g.stroke();
  g.strokeStyle = C.blue; g.fillStyle = C.blue; g.lineWidth = 4;
  if (kind === 'chip') { rr(-34, -76, 68, 52, 8); g.stroke(); for (let i = -2; i <= 2; i++) { g.beginPath(); g.moveTo(i * 12, -76); g.lineTo(i * 12, -88); g.moveTo(i * 12, -24); g.lineTo(i * 12, -12); g.stroke(); } }
  if (kind === 'cloud') { g.beginPath(); g.arc(-22, -46, 22, Math.PI * 0.6, Math.PI * 1.8); g.arc(8, -60, 28, Math.PI * 1.1, Math.PI * 1.95); g.arc(32, -42, 20, Math.PI * 1.5, Math.PI * 0.5); g.closePath(); g.stroke(); }
  if (kind === 'server') { for (let i = 0; i < 3; i++) { rr(-36, -86 + i * 22, 72, 18, 4); g.stroke(); g.beginPath(); g.arc(24, -77 + i * 22, 3, 0, Math.PI * 2); g.fill(); } }
  if (kind === 'bucket') { g.beginPath(); g.ellipse(0, -78, 34, 10, 0, 0, Math.PI * 2); g.moveTo(-34, -78); g.lineTo(-26, -24); g.ellipse(0, -24, 26, 8, 0, Math.PI, 0, true); g.lineTo(34, -78); g.stroke(); }
  text(label, 0, 34, { size: 34, weight: 650, align: 'center' }); text(sub, 0, 74, { size: 22, weight: 500, color: C.muted, align: 'center' });
  g.restore();
}
function wire(a, b, p, label, lp = 1) {
  const [x1, y1] = NODES[a], [x2, y2] = NODES[b]; const sx = x1 + 175, ex = x2 - 175;
  g.save(); g.strokeStyle = 'rgba(8,102,245,.45)'; g.lineWidth = 3; g.setLineDash([10, 10]); g.lineDashOffset = -p * 200; g.beginPath(); g.moveTo(sx, y1);
  g.bezierCurveTo(sx + (ex - sx) * 0.5, y1, sx + (ex - sx) * 0.5, y2, ex, y2); g.stroke(); g.restore();
  if (label) text(label, (sx + ex) / 2, Math.min(y1, y2) + (y1 === y2 ? -26 : (y2 - y1) / 2 - 20), { size: 22, weight: 600, color: C.blue, align: 'center', alpha: lp });
}
function packet(a, b, p, col = '#0866F5') {
  if (p <= 0 || p >= 1) return; const [x1, y1] = NODES[a], [x2, y2] = NODES[b]; const sx = x1 + 175, ex = x2 - 175, u = eio(p);
  const bx = (t) => Math.pow(1 - t, 3) * sx + 3 * Math.pow(1 - t, 2) * t * (sx + (ex - sx) * 0.5) + 3 * (1 - t) * t * t * (sx + (ex - sx) * 0.5) + t * t * t * ex;
  const by = (t) => Math.pow(1 - t, 3) * y1 + 3 * Math.pow(1 - t, 2) * t * y1 + 3 * (1 - t) * t * t * y2 + t * t * t * y2;
  for (let k = 8; k >= 0; k--) { const tt = clamp(u - k * 0.012); g.beginPath(); g.arc(bx(tt), by(tt), 12 - k * 1.1, 0, Math.PI * 2); g.fillStyle = k ? `rgba(8,102,245,${0.35 - k * 0.035})` : col; g.fill(); }
}
OLD.arch = ((t) => {
  bg('#FFFFFF', '#E6F0FD');
  g.save(); g.strokeStyle = 'rgba(8,102,245,.06)'; g.lineWidth = 1; for (let x = 0; x < W; x += 60) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, H); g.stroke(); } for (let y = 0; y < H; y += 60) { g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke(); } g.restore();
  // camera: start close on the probe, follow the message, pull out to the whole system
  const cam = track(t, [[0, [330, 540, 1.7]], [2.5, [330, 540, 1.6]], [7.5, [960, 540, 1.35]], [10.5, [1250, 540, 1.1]], [13.5, [960, 540, 0.92]], [18.8, [960, 540, 0.9]]]);
  g.save(); g.translate(W / 2, H / 2); g.scale(cam[2], cam[2]); g.translate(-cam[0], -cam[1]);
  wire('probe', 'iot', t * 0.3, 'MQTT · TLS · X.509 device certificate', prog(t, 3.2, 4));
  if (t > 7.6) { wire('iot', 'ec2', t * 0.3, 'rule dhara_forward → HTTPS', prog(t, 9.6, 10.4)); wire('iot', 's3', t * 0.3, 'rule dhara_archive', prog(t, 11.4, 12.2)); }
  node('probe', 'ESP32 + DS18B20', 'in-tank probe', prog(t, 0, 0.6), 'chip');
  node('iot', 'AWS IoT Core', 'ap-south-1', prog(t, 3.6, 4.3), 'cloud');
  node('ec2', 'DHARA', 'on Amazon EC2', prog(t, 9.2, 9.9), 'server');
  node('s3', 'Amazon S3', 'raw archive, token removed', prog(t, 11.0, 11.7), 'bucket');
  for (let k = 0; k < 6; k++) { const s0 = 4.0 + k * 2.6; packet('probe', 'iot', prog(t, s0, s0 + 1.6)); packet('iot', 'ec2', prog(t, s0 + 1.7 + (k ? 0 : 3.6), s0 + 3.0 + (k ? 0 : 3.6))); if (k || t > 11) packet('iot', 's3', prog(t, s0 + 1.8 + (k ? 0 : 5.4), s0 + 3.1 + (k ? 0 : 5.4)), '#0D9488'); }
  g.restore();
  rise('How a reading travels', 120, 140, t - 0.3, { size: 46, weight: 650, color: '#0F172A' });
  vignette(0.5);
});

// S5 LIVE PROOF: the simulated board publishes; S3 and the live database on EC2 show the same reading.
function wokwiFrame(ms) { let f = WOKWI[0]; for (const w of WOKWI) { if (w.ms <= ms) f = w; else break; } return f && IMG[f.name]; }
function terminal(x, y, w, h, lines, t, alpha) {
  windowFrame(x, y, w, h, { dark: true, title: 'aws-cli · ap-south-1', alpha });
  g.save(); g.globalAlpha = alpha; g.beginPath(); g.rect(x, y + 44, w, h - 44); g.clip();
  let yy = y + 92, shown = 0;
  for (const [at, str, kind] of lines) {
    if (t < at) break;
    const isCmd = kind === 'cmd', n = isCmd ? Math.floor(clamp((t - at) / Math.max(0.6, str.length * 0.025)) * str.length) : str.length;
    const col = isCmd ? '#fff' : kind === 'hi' ? '#5EEAD4' : kind === 'ok' ? C.light : '#94A3B8';
    text((isCmd ? '$ ' : '') + str.slice(0, n), x + 28, yy, { size: 19, weight: 400, fam: 'Mono', color: col });
    yy += kind === 'gap' ? 18 : 34; shown++;
  }
  g.restore();
}
OLD.proof = ((t) => {
  bg('#FFFFFF', '#E6F0FD');
  const split = eio(prog(t, 10.4, 11.4));
  const wx = lerp(260, 70, split), ww = lerp(1400, 820, split), wh = ww * (1010 / 955) * 0.84;
  windowFrame(wx, 120, ww, wh + 44, { title: 'wokwi.com · simulated ESP32' });
  const fr = wokwiFrame(lerp(0, 12300, prog(t, 0.5, 24)) | 0);
  if (fr) { g.save(); rr(wx, 164, ww, wh, [0, 0, 22, 22]); g.clip();
    const z = track(t, [[0, 1.0], [4, 1.0], [6.5, 1.55], [9.8, 1.55], [11.4, 1.0]]), fy = track(t, [[0, 0.45], [4, 0.45], [6.5, 0.86], [9.8, 0.86], [11.4, 0.5]]);
    const dw = ww * z, dh = dw * (fr.height / fr.width) * 0.84 / 0.84; g.drawImage(fr, wx + ww / 2 - 0.5 * dw, 164 + wh * fy - fy * dh, dw, dh); g.restore(); }
  chip('SIMULATED ESP32 · WOKWI', wx, 60, { color: '#1E293B', fg: C.light, size: 18, alpha: clamp(t * 2) });
  chip('REAL AWS', wx + 380, 60, { color: C.blue, size: 18, alpha: clamp((t - 9.6) * 3) });
  const P = window.PROOF;
  if (split > 0) {
    const lines = [[11.6, P.cmd1, 'cmd'], ...P.s3.map((l, i) => [13.0 + i * 0.12, l, 'out']), [13.8, '', 'gap'], [14.2, P.cmd2, 'cmd'], ...P.objLines.map((l, i) => [15.8 + i * 0.1, l, 'hi']), [16.6, '', 'gap'], [17.0, P.cmd3, 'cmd'], ...P.db.map((l, i) => [18.6 + i * 0.15, l, i ? 'out' : 'ok'])];
    terminal(lerp(W, 940, split), 120, 920, 860, lines, t, split);
  }
  if (t > 22.5) { const a = eout(prog(t, 22.5, 23.2)); chip('SAME READING · 11:43:00 UTC · S3 → DHARA ON EC2', 940, 1000, { color: C.blue, size: 20, alpha: a }); }
});

// S7 IMPACT: three benefits, then the one thing DHARA never claims.
OLD.impact = ((t) => {
  bg('#FFFFFF', '#E6F0FD');
  const B = [['No guessing', 'which tank to test.', 0.8, 'rank'], ['No lost', 'evidence.', 2.6, 'hash'], ['Every decision,', 'named and timed.', 4.3, 'time']];
  const out = eio(prog(t, 6.6, 7.2));
  B.forEach(([a, b, at, kind], i) => {
    if (t < at) return; const p = eout5(prog(t, at, at + 0.7)), x = 330 + i * 630;
    g.save(); g.globalAlpha = p * (1 - out); g.translate(0, (1 - p) * 50 - out * 40);
    const lt = t - at;
    if (kind === 'rank') { ['TANK-B · Medium', 'TANK-A · Urgent'].forEach((s, k) => { const sw = spring(lt - 0.5, 9, 0.7), yy = 330 + (k === 1 ? lerp(90, 0, sw) : lerp(0, 90, sw)); rr(x - 200, yy, 400, 70, 18); g.fillStyle = k === 1 ? 'rgba(239,68,68,.12)' : 'rgba(15,23,42,.05)'; g.fill(); text(s, x - 170, yy + 46, { size: 28, weight: 600, color: k === 1 ? '#DC2626' : '#64748B' }); }); }
    if (kind === 'hash') { const hx = '9f2c41abe07d3c5e88a10b6fd2e47c19'; text(hx.slice(0, Math.floor(clamp(lt / 1.2) * 16)), x, 380, { size: 34, fam: 'Mono', weight: 400, color: '#0D9488', align: 'center' }); text(hx.slice(16, 16 + Math.floor(clamp((lt - 0.6) / 1.2) * 16)), x, 430, { size: 34, fam: 'Mono', weight: 400, color: '#0D9488', align: 'center' }); text('SHA-256', x, 320, { size: 22, weight: 650, color: C.muted, align: 'center', ls: 3 }); }
    if (kind === 'time') { for (let k = 0; k < 3; k++) { const kp = eout(prog(lt, k * 0.3, k * 0.3 + 0.5)); g.globalAlpha = p * kp * (1 - out); g.beginPath(); g.arc(x - 160, 330 + k * 60, 9, 0, Math.PI * 2); g.fillStyle = C.sky; g.fill(); text(['warden · 17:32 · accepted', 'technician · 17:30 · 0.15 mg/L', 'system · 17:30 · follow-up'][k], x - 135, 340 + k * 60, { size: 24, weight: 500, fam: 'Mono', color: C.blue }); } g.globalAlpha = p * (1 - out); }
    text(a, x, 640, { size: 56, weight: 700, align: 'center' }); text(b, x, 712, { size: 56, weight: 400, fam: 'Serif', align: 'center', color: C.blue });

    } else if (t < a13 - 0.15) {
      const sw = a12 + D(12) * 0.6;
      if (t < sw) { name = 'w4_event'; title = 'dhara · maintenance event'; cam = track(t, [[a12, [640, 360, 1.02]], [a12 + 1.6, [640, 600, 1.12]]]); curPts = [[0, 760, 520], [a12 + 0.2, 900, 330], [a12 + 1.5, 620, 610], [a12 + 3.2, 860, 612]]; boxA = [320, 575, 572, 74]; focusA = eout(prog(t, a12 + 1.6, a12 + 2.1)); }
      else { name = 'w35_queue'; title = 'dhara · review queue'; cam = track(t, [[sw, [640, 360, 1.05]], [sw + 0.8, [600, 300, 1.18]]]); curPts = [[0, 860, 612], [sw, 300, 160], [sw + 0.7, 880, 160]]; boxA = [290, 100, 590, 56]; focusA = eout(prog(t, sw + 0.4, sw + 0.8)); }
    }
    const phoneIn = t >= a13 - 0.15, fade = 1 - eio(prog(t, a13 - 0.15, a13 + 0.4));
    if (fade > 0 && name) {
      g.save(); g.globalAlpha = fade; g.translate(W / 2, H / 2); const s = lerp(1, 0.92, 1 - fade); g.scale(s, s); g.translate(-W / 2, -H / 2);

    }

      const lt = t - a13 + 0.15, p = clamp(spring(lt, 10, 0.75), 0, 1.04), pw = 420, ph = 880, px = 560, py = lerp(H + 60, 100, p);
      g.save(); g.shadowColor = 'rgba(15,23,42,.35)'; g.shadowBlur = 70; g.shadowOffsetY = 30; rr(px - 16, py - 16, pw + 32, ph + 32, 64); g.fillStyle = '#0B1222'; g.fill(); g.restore();
      const im = IMG.p1_public; if (im) { g.save(); rr(px, py, pw, ph, 50); g.clip(); const scl = pw / im.width, scroll = track(lt, [[0, 0], [1.2, 0], [D(13), 330]]); g.drawImage(im, px, py - scroll, pw, im.height * scl); g.restore(); }
      rise('Scan the QR. See the status.', 1100, 520, lt - 0.4, { size: 50, weight: 700, color: '#0F172A' });

    }
    const caps = [[a9 + 0.2, 'Every tank at a glance'], [a10 + 0.3, 'Testing priority, with every reason shown'], [a11 + 0.2, 'A technician records free chlorine: 0.15 mg/L'], [a12 + 0.2, 'Evidence, fingerprinted with SHA-256'], [a12 + D(12) * 0.6, 'Submitters can never approve their own work']];
    let cap = null; caps.forEach(([at, s]) => { if (t >= at && t < a13 - 0.15) cap = [at, s]; });
    if (cap) { const a = eout(prog(t, cap[0], cap[0] + 0.35)); font(30, 650); const w = g.measureText(cap[1]).width + 64; g.save(); g.globalAlpha = a; rr(W / 2 - w / 2, 975 + (1 - a) * 16, w, 62, 31); g.fillStyle = '#0F172A'; g.fill(); text(cap[1], W / 2, 1016 + (1 - a) * 16, { size: 30, weight: 600, align: 'center', color: '#fff' }); g.restore(); }
  });

  // S7 IMPACT (kept): re-timed.
  sc(6, (t, L, D) => OLD.impact(remap(t, [[L(14), 0.8], [L(14) + D(14), 6.8], [L(15), 7.4], [L(15) + D(15), 14.56]])));

  sc(7, (t, L, D, len) => {

  });
  window.DURATION = T.total;
}
