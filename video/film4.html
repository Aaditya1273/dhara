<!doctype html>
<html><head><meta charset="utf-8"><title>DHARA</title>
<style>
@font-face { font-family: 'Inter'; src: url('../static/fonts/inter-var.woff2') format('woff2'); font-weight: 100 900; }
@font-face { font-family: 'Mono'; src: url('../static/fonts/plex-mono-400.woff2') format('woff2'); }
html, body { margin: 0; background: #fff; } canvas { display: block; }
</style></head>
<body><canvas id="c" width="1920" height="1080"></canvas>
<script>
// DHARA, 75 s. Every frame is a pure function of time t (seek). Google four-colour system on white.
const W = 1920, H = 1080, g = document.getElementById('c').getContext('2d');
const K = { blue: '#4285F4', red: '#EA4335', yellow: '#FBBC05', green: '#34A853', ink: '#202124', grey: '#5F6368', line: '#DADCE0', soft: '#F8F9FA', pale: '#E8F0FE' };
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x)), lerp = (a, b, t) => a + (b - a) * t, prog = (t, a, b) => clamp((t - a) / (b - a));
const eio = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2), eout = (t) => 1 - Math.pow(1 - t, 3), eout5 = (t) => 1 - Math.pow(1 - t, 5), ein = (t) => t * t * t;
const spr = (t, w = 15, z = 0.7) => (t <= 0 ? 0 : 1 - Math.exp(-z * w * t) * (Math.cos(w * Math.sqrt(1 - z * z) * t) + (z / Math.sqrt(1 - z * z)) * Math.sin(w * Math.sqrt(1 - z * z) * t)));
const keys = (t, ks, ease = eio) => { if (t <= ks[0][0]) return ks[0][1]; for (let i = 1; i < ks.length; i++) if (t <= ks[i][0]) { const p = ease(prog(t, ks[i - 1][0], ks[i][0])); const a = ks[i - 1][1], b = ks[i][1]; return Array.isArray(a) ? a.map((v, j) => lerp(v, b[j], p)) : lerp(a, b, p); } return ks[ks.length - 1][1]; };

// ---- timeline (voice-over line starts, seconds) ----
const L = { 1: 0.5, 2: 2.75, 3: 5.0, 4: 12.6, 5: 19.8, 6: 30.4, 7: 41.3, 8: 46.0, 9: 52.6, 10: 59.5, 11: 64.2, 12: 70.1 };
const DUR = 75.5;

// ---- assets ----
const IMG = {}, WK = [];
const load = (n, src) => new Promise((r) => { const i = new Image(); i.onload = () => { IMG[n] = i; r(); }; i.onerror = r; i.src = src; });
window.ready = (async () => {
  const P = 'cap/product/', jobs = ['t2_form0', 't2_type1', 't2_type2', 't2_type3', 't2_type4', 'w2_priority', 'w4_event', 'w35_queue', 'p1_public'].map((n) => load(n, P + n + '.jpg'));
  const list = await fetch('cap/wokwi/list.json').then((r) => r.json());
  list.forEach((f) => { const ms = parseInt(f.slice(2, 8), 10); if (ms > 12500) return; WK.push(ms); jobs.push(load('wk' + ms, 'cap/wokwi/' + f)); });
  window.PROOF = await fetch('cap/proof.json').then((r) => r.json());
  window.BOX = await fetch('cap/boxes.json').then((r) => r.json());
  await Promise.all(jobs); await document.fonts.load('700 40px Inter'); await document.fonts.load('20px Mono'); return true;
})();

// ---- primitives ----
function T(s, x, y, { size = 40, w = 600, color = K.ink, align = 'left', a = 1, ls = 0, mono = false } = {}) {
  if (a <= 0) return; g.save(); g.globalAlpha *= a; g.font = `${w} ${size}px ${mono ? 'Mono' : 'Inter'}`; g.letterSpacing = ls + 'px'; g.fillStyle = color; g.textAlign = align; g.fillText(s, x, y); g.restore();
}
function width(s, size, w = 600, ls = 0, mono = false) { g.save(); g.font = `${w} ${size}px ${mono ? 'Mono' : 'Inter'}`; g.letterSpacing = ls + 'px'; const v = g.measureText(s).width; g.restore(); return v; }
// Masked word reveal (words rise from a baseline mask); colors per word optional.
function words(s, x, y, t, { size = 96, w = 700, color = K.ink, colors = {}, align = 'left', st = 0.06, d = 0.55, ls = -2, out = 0 } = {}) {
  const ws = s.split(' '), sp = width(' ', size, w, ls), wd = ws.map((v) => width(v, size, w, ls)), tot = wd.reduce((a, b) => a + b, 0) + sp * (ws.length - 1);
  let cx = align === 'center' ? x - tot / 2 : x;
  ws.forEach((v, i) => {
    const p = eout5(prog(t, i * st, i * st + d)), q = ein(out);
    if (p > 0) { g.save(); g.beginPath(); g.rect(cx - 8, y - size * 1.0, wd[i] + 16, size * 1.3); g.clip(); T(v, cx, y + (1 - p) * size * 1.05 - q * size * 1.1, { size, w, color: colors[i] || color, ls }); g.restore(); }
    cx += wd[i] + sp;
  });
  return { x0: align === 'center' ? x - tot / 2 : x, tot, wd, sp };
}
const rr = (x, y, w, h, r) => { g.beginPath(); g.roundRect(x, y, w, h, r); };
function shadowCard(x, y, w, h, r = 24, fill = '#fff', sh = 0.10) { g.save(); g.shadowColor = `rgba(32,33,36,${sh})`; g.shadowBlur = 40; g.shadowOffsetY = 14; rr(x, y, w, h, r); g.fillStyle = fill; g.fill(); g.restore(); g.save(); rr(x + 0.5, y + 0.5, w - 1, h - 1, r); g.strokeStyle = K.line; g.lineWidth = 1; g.stroke(); g.restore(); }
function pill(cx, cy, w, h, color, text, { a = 1, tc = '#fff', size = 30, icon = null } = {}) {
  if (a <= 0 || w < 2) return; g.save(); g.globalAlpha *= a; rr(cx - w / 2, cy - h / 2, w, h, h / 2); g.fillStyle = color; g.fill();
  if (text && w > h * 1.6) { g.beginPath(); g.rect(cx - w / 2, cy - h / 2, w, h); g.clip(); T(text, cx + (icon ? 18 : 0), cy + size * 0.36, { size, w: 650, color: tc, align: 'center' }); if (icon) icon(cx - w / 2 + h * 0.62, cy); }
  g.restore();
}
function check(x, y, s = 14, col = '#fff') { g.save(); g.strokeStyle = col; g.lineWidth = 4; g.lineCap = 'round'; g.lineJoin = 'round'; g.beginPath(); g.moveTo(x - s * 0.7, y); g.lineTo(x - s * 0.15, y + s * 0.55); g.lineTo(x + s * 0.8, y - s * 0.55); g.stroke(); g.restore(); }
function drop(cx, cy, s, a = 1, col = K.blue) { // DHARA drop mark
  g.save(); g.globalAlpha *= a; g.translate(cx, cy); g.scale(s / 32, s / 32); g.translate(-16, -16);
  g.beginPath(); g.moveTo(16, 3.5); g.bezierCurveTo(16, 3.5, 7.5, 13.1, 7.5, 19.1); g.arc(16, 19.1, 8.5, Math.PI, 0, true); g.bezierCurveTo(24.5, 13.1, 16, 3.5, 16, 3.5); g.closePath(); g.fillStyle = col; g.fill();
  g.strokeStyle = '#fff'; g.lineWidth = 1.7; g.lineCap = 'round'; [19.6, 23.2].forEach((y, i) => { g.globalAlpha = a * (i ? 0.6 : 1); g.beginPath(); g.moveTo(11.2, y); g.bezierCurveTo(12.8, y - 1.3, 14.4, y - 1.3, 16, y); g.bezierCurveTo(17.6, y + 1.3, 19.2, y + 1.3, 20.8, y); g.stroke(); });
  g.restore();
}
function dots(cx, cy, r, gap, a = 1, p = 1) { [K.blue, K.red, K.yellow, K.green].forEach((c, i) => { const q = eout5(prog(p, i * 0.08, 0.6 + i * 0.08)); g.save(); g.globalAlpha *= a * q; g.beginPath(); g.arc(cx + (i - 1.5) * gap, cy + (1 - q) * 30, r, 0, Math.PI * 2); g.fillStyle = c; g.fill(); g.restore(); }); }

// After-Effects-style cursor: drawn with a short motion trail from its own velocity, squish on click.
function cursorGlyph(x, y, s = 1.6, a = 1) { g.save(); g.globalAlpha *= a; g.translate(x, y); g.scale(s, s); g.shadowColor = 'rgba(0,0,0,.28)'; g.shadowBlur = 6; g.shadowOffsetY = 2;
  g.beginPath(); g.moveTo(0, 0); g.lineTo(0, 21); g.lineTo(5.2, 16.2); g.lineTo(9, 24.8); g.lineTo(12.6, 23.3); g.lineTo(8.8, 14.9); g.lineTo(15.4, 14.9); g.closePath(); g.fillStyle = K.ink; g.fill(); g.shadowColor = 'transparent'; g.lineWidth = 1.5; g.strokeStyle = '#fff'; g.stroke(); g.restore(); }
function cursorPos(t, pts) { // pts: [[t0,x,y],...] moves start at t_i, take dur_i (default 0.5)
  let x = pts[0][1], y = pts[0][2];
  for (let i = 1; i < pts.length; i++) { const [ts, tx, ty, dur = 0.5] = pts[i]; if (t < ts) break; const p = clamp((t - ts) / dur);
    const e = clamp(spr(p * dur, 13, 0.82), 0, 1.03), dx = tx - x, dy = ty - y, arc = Math.sin(Math.PI * Math.min(1, p * 1.15)) * 0.10;
    if (p >= 1) { x = tx; y = ty; } else { return [x + dx * e - dy * arc, y + dy * e + dx * arc]; } }
  return [x + Math.sin(t * 1.9) * 1.6, y + Math.cos(t * 1.4) * 1.3];
}
function drawCursor(t, pts, map, clicks = []) {
  const [x, y] = map(...cursorPos(t, pts)), [x2, y2] = map(...cursorPos(t - 1 / 60, pts)), sp = Math.hypot(x - x2, y - y2);
  for (let k = 3; k >= 1; k--) if (sp > 6) { const f = k / 4; cursorGlyph(lerp(x, x2 - (x - x2) * 1.5, f), lerp(y, y2 - (y - y2) * 1.5, f), 1.6, 0.12 * (4 - k) / 3); }
  let press = 0; clicks.forEach((c) => { const q = prog(t, c, c + 0.5); if (q > 0 && q < 1) { g.save(); g.globalAlpha = (1 - q) * 0.9; g.strokeStyle = K.blue; g.lineWidth = 3; g.beginPath(); g.arc(x, y, 8 + eout(q) * 30, 0, Math.PI * 2); g.stroke(); g.restore(); } if (t > c && t < c + 0.12) press = 1; });
  cursorGlyph(x, y, 1.6 * (1 - press * 0.15));
}
// Product window and camera (page CSS px, 1280 wide)
const WIN = { x: 200, y: 92, w: 1520, h: 855 + 40 };
function windowChrome(x, y, w, h, title, a = 1) { g.save(); g.globalAlpha *= a; shadowCard(x, y, w, h, 18, '#fff', 0.14); rr(x, y, w, 40, [18, 18, 0, 0]); g.fillStyle = K.soft; g.fill();
  [K.red, K.yellow, K.green].forEach((c, i) => { g.beginPath(); g.arc(x + 24 + i * 20, y + 20, 6, 0, Math.PI * 2); g.fillStyle = c; g.fill(); });
  T(title, x + w / 2, y + 26, { size: 16, w: 500, color: K.grey, align: 'center' }); g.restore(); }
function pageView(name, cx, cy, z, a = 1) {
  const im = IMG[name]; if (!im) return null; const sc = im.width / 1280, vw = 1280 / z, vh = 720 / z, docH = im.height / sc;
  const sx = clamp(cx - vw / 2, 0, 1280 - vw), sy = clamp(cy - vh / 2, 0, Math.max(0, docH - vh));
  g.save(); g.globalAlpha *= a; rr(WIN.x, WIN.y + 40, WIN.w, WIN.h - 40, [0, 0, 18, 18]); g.clip(); g.fillStyle = '#F7FAFF'; g.fillRect(WIN.x, WIN.y + 40, WIN.w, WIN.h - 40);
  g.drawImage(im, sx * sc, sy * sc, vw * sc, vh * sc, WIN.x, WIN.y + 40, WIN.w, WIN.h - 40); g.restore();
  return (px, py) => [WIN.x + (px - sx) * (WIN.w / vw), WIN.y + 40 + (py - sy) * ((WIN.h - 40) / vh)];
}
function ring(map, b, a, col = K.blue) { if (!map || a <= 0) return; const [x1, y1] = map(b[0], b[1]), [x2, y2] = map(b[0] + b[2], b[1] + b[3]), pad = 8;
  g.save(); g.globalAlpha = a; rr(x1 - pad, y1 - pad, x2 - x1 + pad * 2, y2 - y1 + pad * 2, 16); g.lineWidth = 3; g.strokeStyle = col; g.stroke(); g.globalAlpha = a * 0.08; g.fillStyle = col; g.fill(); g.restore(); }
const lerpBox = (a, b, p) => a.map((v, i) => lerp(v, b[i], p));
function bg() { g.fillStyle = '#fff'; g.fillRect(0, 0, W, H); }

// =========================== SCENES ===========================
function hook(t) { // 0 – 12.1
  bg();
  // 0.0: four Google dots land; the green one becomes the "Cleaned" record
  const morph = eout5(prog(t, 0.45, 1.05)), up = eio(prog(t, L[2] - 0.15, L[2] + 0.45)), leave = eio(prog(t, 11.45, 12.1)), pillOut = eio(prog(t, L[3] + 1.1, L[3] + 1.45));
  const others = 1 - eout(prog(t, 0.35, 0.7));
  [K.blue, K.red, K.yellow].forEach((c, i) => { const q = eout5(prog(t, 0.0 + i * 0.06, 0.4 + i * 0.06)); const x = W / 2 + (i - 1.5) * 70 - (1 - others) * (i - 1.5) * 260; g.save(); g.globalAlpha = q * others; g.beginPath(); g.arc(x, 540 + (1 - q) * 40, 22, 0, Math.PI * 2); g.fillStyle = c; g.fill(); g.restore(); });
  const gq = eout5(prog(t, 0.18, 0.58)), py = lerp(540, 300, up) + (1 - gq) * 40, pw = lerp(44, 520, morph) * lerp(1, 0.8, up), ph = lerp(44, 110, morph) * lerp(1, 0.8, up);
  if (pillOut < 1) {
    g.save(); g.globalAlpha = gq * (1 - pillOut); const px = W / 2 + 1.5 * 70 * (1 - morph);
    rr(px - pw / 2, py - ph / 2, pw, ph, ph / 2); g.fillStyle = K.green; g.fill();
    if (morph > 0.4) { const ta = prog(morph, 0.4, 1); g.globalAlpha *= ta; check(px - pw / 2 + ph * 0.55, py, 18 * lerp(1, 0.8, up)); T('Cleaned · 12 March', px + ph * 0.25, py + 16 * lerp(1, 0.8, up), { size: 44 * lerp(1, 0.8, up), w: 650, color: '#fff', align: 'center' }); }
    g.restore();
    T('Tank A, maintenance register', W / 2, py - ph / 2 - 30, { size: 24, w: 500, color: K.grey, align: 'center', a: prog(t, 1.0, 1.4) * (1 - pillOut) });
  }
  // L2: the question
  const qOut = prog(t, L[3] - 0.25, L[3] + 0.15);
  if (t > L[2] && qOut < 1) {
    const r = words('Is the water safe today?', W / 2, 600, t - L[2], { size: 120, w: 700, align: 'center', colors: { 3: K.red }, out: qOut });
    const ul = eout(prog(t, L[2] + 0.9, L[2] + 1.3)); if (ul > 0) { const sx = r.x0 + r.wd.slice(0, 3).reduce((a, b) => a + b, 0) + r.sp * 3; g.save(); g.globalAlpha = 1 - qOut; rr(sx, 628, r.wd[3] * ul, 8, 4); g.fillStyle = K.red; g.fill(); g.restore(); }
  }
  // L3: nobody can tell — then heat drains chlorine
  const a3 = t - L[3], nOut = prog(t, L[3] + 1.25, L[3] + 1.55);
  if (a3 > 0 && nOut < 1) words('Nobody can tell you.', W / 2, 600, a3, { size: 120, w: 700, align: 'center', out: nOut });
  if (a3 > 1.35) {
    const lt = a3 - 1.35, out = leave;
    // the sun: a clean yellow disc sliding in from the top right
    const sp = eout5(prog(lt, 0, 0.8)); g.save(); g.globalAlpha = 1 - out; g.beginPath(); g.arc(lerp(2200, 1560, sp), lerp(-200, 250, sp), 170, 0, Math.PI * 2); g.fillStyle = K.yellow; g.fill(); g.restore();
    T('Heat drains chlorine', 200, 330, { size: 84, w: 700, a: eout(prog(lt, 0.1, 0.5)) * (1 - out) });
    // chlorine meter: green to red as it drains past the minimum
    const dr = eio(prog(lt, 0.4, 2.2)), lvl = lerp(0.82, 0.14, dr), col = lvl > 0.3 ? K.green : lvl > 0.22 ? K.yellow : K.red;
    g.save(); g.globalAlpha = eout(prog(lt, 0.2, 0.6)) * (1 - out);
    rr(200, 410, 1000, 54, 27); g.fillStyle = K.soft; g.fill(); g.strokeStyle = K.line; g.lineWidth = 1.5; g.stroke();
    rr(200, 410, Math.max(54, 1000 * lvl), 54, 27); g.fillStyle = col; g.fill();
    g.fillStyle = K.ink; g.fillRect(200 + 1000 * 0.25 - 1.5, 395, 3, 84); T('minimum', 200 + 250, 380, { size: 22, w: 600, color: K.grey, align: 'center' });
    T(`free chlorine ${(lvl * 0.75).toFixed(2)} mg/L`, 200, 520, { size: 30, w: 600, color: col });
    T('illustration', 1200, 520, { size: 20, w: 500, color: K.grey, align: 'right' });
    g.restore();
    // the record sits outside a tank it cannot see into
    const tk = eout5(prog(lt, 2.45, 3.1));
    if (tk > 0) { g.save(); g.globalAlpha = (1 - out); const x = 230, y = 640, w = 520, h = 320;
      rr(x, y + (1 - tk) * 40, w, h, 36); g.fillStyle = K.pale; g.fill(); g.lineWidth = 3; g.strokeStyle = K.blue; g.stroke();
      T('?', x + w / 2, y + h / 2 + 50 + (1 - tk) * 40, { size: 150, w: 700, color: K.blue, align: 'center', a: tk });
      pill(x + w + 330, y + 120, 420 * tk, 86, K.green, 'Cleaned · 12 March', { size: 32, a: tk });
      T("A record can't see inside.", x + w + 120, y + 260, { size: 44, w: 650, a: eout(prog(lt, 3.0, 3.4)) });
      g.restore(); }
  }
  // transition: the tank's blue becomes a circle that opens DHARA
  if (leave > 0) { const r = ein(leave) * 1500; g.save(); g.beginPath(); g.arc(490, 800, r, 0, Math.PI * 2); g.fillStyle = K.blue; g.fill(); g.restore(); }
}

function dhara(t) { // 12.1 – 19.3
  const lt = t - 12.1, shrink = eio(prog(lt, 0, 0.7));
  g.fillStyle = K.blue; g.fillRect(0, 0, W, H);
  const r = lerp(1800, 0, shrink); g.save(); g.beginPath(); g.arc(W / 2, 520, Math.max(0, 2200 - r), 0, Math.PI * 2); g.fillStyle = '#fff'; g.fill(); g.restore();
  const lp = clamp(spr(lt - 0.45, 12, 0.66), 0, 1.06); drop(W / 2, 330, 170 * lp);
  words('DHARA', W / 2, 560, lt - 0.7, { size: 130, w: 700, align: 'center', ls: 4, st: 0.04 });
  dots(W / 2, 620, 9, 34, 1, prog(lt, 1.0, 2.0));
  const items = [['Measure', K.blue, 0.05], ['Prioritise', K.red, 0.42], ['Prove', K.green, 0.72]];
  items.forEach(([s, c, f], i) => { const at = (L[4] - 12.1) + 6.1 * f, p = clamp(spr(lt - at, 14, 0.7), 0, 1.04); if (p <= 0) return;
    const x = W / 2 + (i - 1) * 420, wd = 360 * clamp(p); pill(x, 800, wd, 96, c, s, { size: 38, a: clamp(p * 2) }); });
}

function proof(t) { // 19.3 – 40.9
  bg(); const lt = t - 19.3, l6 = L[6] - 19.3;
  // the pipeline, top: active node follows the narration
  const nodes = [['ESP32 · Wokwi', K.grey, 1.2], ['AWS IoT Core', K.blue, 6.0], ['Amazon S3', K.yellow, l6 + 1.4], ['DHARA on EC2', K.green, l6 + 4.6]];
  const nx = [330, 790, 1250, 1650];
  nodes.forEach(([s, c, at], i) => { const on = t - 19.3 >= at, p = eout5(prog(lt, i * 0.12, 0.5 + i * 0.12));
    if (i) { g.save(); g.globalAlpha = p; g.strokeStyle = on ? c : K.line; g.lineWidth = 3; g.beginPath(); g.moveTo(nx[i - 1] + 150, 110); g.lineTo(nx[i] - 150, 110); g.stroke(); g.restore(); }
    g.save(); g.globalAlpha = p; rr(nx[i] - 150, 82, 300, 56, 28); g.fillStyle = on ? c : '#fff'; g.fill(); g.strokeStyle = on ? c : K.line; g.lineWidth = 1.5; g.stroke();
    T(s, nx[i], 119, { size: 22, w: 650, color: on ? '#fff' : K.grey, align: 'center' }); g.restore(); });
  T('SIMULATED DEVICE', 330, 170, { size: 16, w: 650, color: K.grey, align: 'center', ls: 2, a: prog(lt, 1, 1.4) });
  T('REAL AWS · ap-south-1', 1450, 170, { size: 16, w: 650, color: K.blue, align: 'center', ls: 2, a: prog(lt, 6, 6.4) });
  // Wokwi window: real frames of the simulated board publishing over MQTT
  const sh = eio(prog(lt, l6 - 0.3, l6 + 0.5)), wx = lerp(260, 80, sh), ww = lerp(1400, 760, sh), wy = 210, wh = lerp(800, 760, sh);
  windowChrome(wx, wy, ww, wh, 'wokwi.com · simulated ESP32 + DS18B20');
  const ms = lerp(0, 12300, prog(lt, 0.2, 21)); let fr = WK[0]; for (const m of WK) if (m <= ms) fr = m;
  const im = IMG['wk' + fr];
  if (im) { g.save(); rr(wx, wy + 40, ww, wh - 40, [0, 0, 18, 18]); g.clip(); g.fillStyle = '#EEE'; g.fillRect(wx, wy + 40, ww, wh - 40);
    const z = keys(lt, [[0, 1], [3.5, 1], [5.0, 1.9], [l6 - 0.4, 1.9], [l6 + 0.5, 1.05]]), fy = keys(lt, [[0, 0.5], [3.5, 0.5], [5.0, 0.9], [l6 - 0.4, 0.9], [l6 + 0.5, 0.55]]);
    const dw = ww * z, dh = dw * im.height / im.width, fx = keys(lt, [[0, 0.5], [3.5, 0.5], [5.0, 0.3], [l6 - 0.4, 0.3], [l6 + 0.5, 0.5]]);
    g.drawImage(im, wx + ww / 2 - fx * dw + (fx - 0.5) * ww * 0, wy + 40 + (wh - 40) * fy - fy * dh, dw, dh); g.restore();
    const band = prog(lt, 5.2, 5.6) * (1 - prog(lt, l6 - 0.5, l6 - 0.2)); if (band > 0) { g.save(); g.globalAlpha = band; rr(wx + 12, wy + wh - 120, ww - 24, 60, 12); g.lineWidth = 3; g.strokeStyle = K.blue; g.stroke(); g.restore(); T('MQTT publish OK → dhara/dhara-wokwi-01/telemetry', wx + 24, wy + wh - 140, { size: 22, w: 650, color: K.blue, a: band }); }
  }
  // terminal: real command output (S3 archive + DHARA's live database on EC2)
  if (sh > 0) {
