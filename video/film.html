<!doctype html>
<html><head><meta charset="utf-8"><title>DHARA film</title>
<style>
@font-face { font-family: 'Inter'; src: url('../static/fonts/inter-var.woff2') format('woff2'); font-weight: 100 900; }
@font-face { font-family: 'Serif'; src: url('../static/fonts/instrument-serif.woff2') format('woff2'); }
@font-face { font-family: 'Mono'; src: url('../static/fonts/plex-mono-400.woff2') format('woff2'); }
html, body { margin: 0; background: #000; }
canvas { display: block; }
</style></head>
<body><canvas id="c" width="1920" height="1080"></canvas>
<script>
// Every frame is a pure function of time: seek(t) draws the whole film at t seconds.
const W = 1920, H = 1080, cv = document.getElementById('c'), g = cv.getContext('2d');
const C = { blue: '#0866F5', sky: '#3B82F6', light: '#93C5FD', pale: '#EAF3FF', navy: '#0B1222', ink: '#04070C',
  white: '#FFFFFF', muted: '#94A3B8', dim: '#64748B', teal: '#14B8A6', heat: '#F59E0B', red: '#EF4444', paper: '#FBF7EC' };
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const eio = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
const eout = (t) => 1 - Math.pow(1 - t, 3);
const eout5 = (t) => 1 - Math.pow(1 - t, 5);
const ein = (t) => t * t * t;
function spring(t, w = 16, z = 0.72) { if (t <= 0) return 0; const wd = w * Math.sqrt(1 - z * z); return 1 - Math.exp(-z * w * t) * (Math.cos(wd * t) + (z * w / wd) * Math.sin(wd * t)); }
function rng(seed) { return () => { seed |= 0; seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

// ---------- assets ----------
const IMG = {};
const WOKWI = [];
function load(name, src) { return new Promise((res) => { const i = new Image(); i.onload = () => { IMG[name] = i; res(); }; i.onerror = () => res(); i.src = src; }); }
window.ready = (async () => {
  const P = 'cap/product/';
  const names = ['t2_form0', 't2_type1', 't2_type2', 't2_type3', 't2_type4', 'w1_dashboard', 'w2_priority', 'w3_tank', 'w35_queue', 'w4_event', 'p1_public'];
  const jobs = names.map((n) => load(n, P + n + '.jpg'));
  jobs.push(load('hero', '../static/img/hero-1672.webp'));
  const wk = await fetch('cap/wokwi/list.json').then((r) => r.json());
  wk.forEach((f) => { const ms = parseInt(f.slice(2, 8), 10); WOKWI.push({ ms, name: 'wk' + ms }); jobs.push(load('wk' + ms, 'cap/wokwi/' + f)); });
  window.PROOF = await fetch('cap/proof.json').then((r) => r.json());
  await Promise.all(jobs);
  await document.fonts.load('600 40px Inter'); await document.fonts.load('40px Serif'); await document.fonts.load('20px Mono');
  return true;
})();

// ---------- drawing helpers ----------
function font(size, weight = 600, fam = 'Inter') { g.font = `${weight} ${size}px ${fam === 'Inter' ? 'Inter' : fam}`; }
function text(s, x, y, { size = 40, weight = 600, fam = 'Inter', color = C.white, align = 'left', alpha = 1, ls = 0, base = 'alphabetic' } = {}) {
  if (alpha <= 0) return; g.save(); g.globalAlpha *= alpha; font(size, weight, fam); g.fillStyle = color; g.textAlign = align; g.textBaseline = base;
  g.letterSpacing = ls + 'px'; g.fillText(s, x, y); g.restore();
}
// Words rise out of a mask line, one after another.
function rise(s, x, y, t, { size = 72, weight = 650, fam = 'Inter', color = C.white, align = 'left', stagger = 0.07, dur = 0.7, ls = -1, colors = null } = {}) {
  font(size, weight, fam); g.letterSpacing = ls + 'px';
  const words = s.split(' '), sp = g.measureText(' ').width, ws = words.map((w) => g.measureText(w).width);
  const total = ws.reduce((a, b) => a + b, 0) + sp * (words.length - 1);
  let cx = align === 'center' ? x - total / 2 : align === 'right' ? x - total : x;
  words.forEach((w, i) => {
    const p = eout5(prog(t, i * stagger, i * stagger + dur));
    if (p > 0) {
      g.save(); g.beginPath(); g.rect(cx - 10, y - size * 1.05, ws[i] + 20, size * 1.35); g.clip();
      text(w, cx, y + (1 - p) * size * 1.1, { size, weight, fam, color: colors ? colors[i] || color : color, ls, alpha: clamp(p * 1.4) });
      g.restore();
    }
    cx += ws[i] + sp;
  });
}
function rr(x, y, w, h, r) { g.beginPath(); g.roundRect(x, y, w, h, r); }
function dropPath(cx, cy, r, stretch = 1) {
  g.beginPath(); const top = cy - r * 2.1 * stretch;
  g.moveTo(cx, top);
  g.bezierCurveTo(cx + r * 0.25, top + r * 0.9 * stretch, cx + r, cy - r * 0.55, cx + r, cy);
  g.arc(cx, cy, r, 0, Math.PI, false);
  g.bezierCurveTo(cx - r, cy - r * 0.55, cx - r * 0.25, top + r * 0.9 * stretch, cx, top);
  g.closePath();
}
function drawDrop(cx, cy, r, stretch = 1, alpha = 1) {
  g.save(); g.globalAlpha = alpha; dropPath(cx, cy, r, stretch);
  const gr = g.createLinearGradient(cx - r, cy - r * 2, cx + r, cy + r); gr.addColorStop(0, '#9CC8FF'); gr.addColorStop(0.5, C.blue); gr.addColorStop(1, '#0646B8');
  g.fillStyle = gr; g.fill();
  g.beginPath(); g.ellipse(cx - r * 0.38, cy - r * 0.15, r * 0.16, r * 0.34, -0.4, 0, Math.PI * 2); g.fillStyle = 'rgba(255,255,255,.75)'; g.fill();
  g.restore();
}
function logo(cx, cy, s, alpha = 1) { // the DHARA drop with two white waves
  g.save(); g.globalAlpha = alpha; g.translate(cx, cy); g.scale(s / 32, s / 32); g.translate(-16, -16);
  g.beginPath(); g.moveTo(16, 3.5); g.bezierCurveTo(16, 3.5, 7.5, 13.1, 7.5, 19.1); g.arc(16, 19.1, 8.5, Math.PI, 0, true);
  g.bezierCurveTo(24.5, 13.1, 16, 3.5, 16, 3.5); g.closePath(); g.fillStyle = C.blue; g.fill();
  g.strokeStyle = '#fff'; g.lineWidth = 1.7; g.lineCap = 'round';
  [19.6, 23.2].forEach((y, i) => { g.globalAlpha = alpha * (i ? 0.55 : 1); g.beginPath(); g.moveTo(11.2, y); g.bezierCurveTo(12.8, y - 1.3, 14.4, y - 1.3, 16, y); g.bezierCurveTo(17.6, y + 1.3, 19.2, y + 1.3, 20.8, y); g.stroke(); });
  g.restore();
}
function bg(top, bottom) { const gr = g.createLinearGradient(0, 0, 0, H); gr.addColorStop(0, top); gr.addColorStop(1, bottom); g.fillStyle = gr; g.fillRect(0, 0, W, H); }
function vignette(a = 0.55) { const gr = g.createRadialGradient(W / 2, H / 2, H * 0.35, W / 2, H / 2, H * 0.95); gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(1, `rgba(0,0,0,${a})`); g.fillStyle = gr; g.fillRect(0, 0, W, H); }
function grain(t, a = 0.035) { const r = rng(Math.floor(t * 30) + 7); g.save(); g.globalAlpha = a; g.fillStyle = '#fff'; for (let i = 0; i < 900; i++) g.fillRect(r() * W, r() * H, 1.5, 1.5); g.restore(); }
function chip(s, x, y, { color = C.blue, fg = '#fff', size = 22, alpha = 1, dot = true } = {}) {
  if (alpha <= 0) return; g.save(); g.globalAlpha = alpha; font(size, 650); g.letterSpacing = '1.5px';
  const w = g.measureText(s).width + (dot ? 56 : 36); rr(x, y, w, size * 2, size); g.fillStyle = color; g.fill();
  if (dot) { g.beginPath(); g.arc(x + 24, y + size, 6, 0, Math.PI * 2); g.fillStyle = fg; g.fill(); }
  text(s, x + (dot ? 40 : 18), y + size * 1.36, { size, weight: 650, color: fg, ls: 1.5 }); g.restore(); return w;
}
function windowFrame(x, y, w, h, { alpha = 1, bar = 44, title = '', dark = false } = {}) {
  g.save(); g.globalAlpha = alpha;
  g.shadowColor = 'rgba(0,0,0,.45)'; g.shadowBlur = 80; g.shadowOffsetY = 30; rr(x, y, w, h, 22); g.fillStyle = dark ? '#0E1525' : '#fff'; g.fill();
  g.shadowColor = 'transparent'; rr(x, y, w, bar, [22, 22, 0, 0]); g.fillStyle = dark ? '#131C30' : '#F1F5F9'; g.fill();
  ['#FF5F57', '#FEBC2E', '#28C840'].forEach((c, i) => { g.beginPath(); g.arc(x + 26 + i * 22, y + bar / 2, 7, 0, Math.PI * 2); g.fillStyle = c; g.fill(); });
  if (title) { font(18, 600, 'Mono'); const tw = g.measureText(title).width + 32; rr(x + w / 2 - tw / 2, y + 9, tw, bar - 18, 13); g.fillStyle = C.blue; g.fill(); text(title, x + w / 2, y + bar / 2 + 6, { size: 17, weight: 600, fam: 'Mono', color: '#fff', align: 'center' }); }
  g.restore();
}
function cursor(x, y, press = 0, alpha = 1) {
  g.save(); g.globalAlpha = alpha; g.translate(x, y); const s = 1.7 * (1 - press * 0.16); g.scale(s, s);
  g.shadowColor = 'rgba(0,0,0,.35)'; g.shadowBlur = 8; g.shadowOffsetY = 3;
  g.beginPath(); g.moveTo(0, 0); g.lineTo(0, 22); g.lineTo(5.5, 17); g.lineTo(9.5, 26); g.lineTo(13, 24.5); g.lineTo(9, 16); g.lineTo(16, 16); g.closePath();
  g.fillStyle = '#0B0F19'; g.fill(); g.shadowColor = 'transparent'; g.lineWidth = 1.6; g.strokeStyle = '#fff'; g.stroke(); g.restore();
}
function clickRing(x, y, p) { if (p <= 0 || p >= 1) return; g.save(); g.globalAlpha = (1 - p) * 0.8; g.strokeStyle = C.blue; g.lineWidth = 3; g.beginPath(); g.arc(x, y, 10 + eout(p) * 34, 0, Math.PI * 2); g.stroke(); g.restore(); }
function track(t, keys) { // piecewise eased keyframes [[time, value], ...]
  if (t <= keys[0][0]) return keys[0][1];
  for (let i = 1; i < keys.length; i++) { const [t1, v1] = keys[i], [t0, v0] = keys[i - 1]; if (t <= t1) { const p = eio(prog(t, t0, t1)); return Array.isArray(v0) ? v0.map((v, j) => lerp(v, v1[j], p)) : lerp(v0, v1, p); } }
  return keys[keys.length - 1][1];
}

// ---------- scenes (start, end, draw(local t)) ----------
const SCENES = [];
const scene = (a, b, fn) => SCENES.push({ a, b, fn });

// S1 HOOK: a drop falls, the splash opens into a rooftop tank under a time-lapse sun.
scene(0, 10.6, (t) => {
  g.fillStyle = C.ink; g.fillRect(0, 0, W, H);
  const impact = 1.9, surf = 650, cx = W / 2;
  // the photo, revealed through the expanding ripple
  const ir = eio(prog(t, 2.25, 4.1)) * 1500;
  if (ir > 0) {
    g.save(); g.beginPath(); g.ellipse(cx, surf, ir * 1.15, ir, 0, 0, Math.PI * 2); g.clip();
    const hero = IMG.hero, z = lerp(1.55, 1.12, eout(prog(t, 2.2, 5))) * lerp(1, 1.42, eio(prog(t, 5, 10.6)));
    const fx = lerp(0.5, 0.72, eio(prog(t, 4.5, 10.6))), fy = lerp(0.5, 0.47, eio(prog(t, 4.5, 10.6)));
    const dw = W * z, dh = dw * (hero.height / hero.width);
    g.drawImage(hero, W / 2 - fx * dw, H / 2 - fy * dh, dw, dh);
    // time-lapse light: the sun sweeps across, the day warms up
    const sp = prog(t, 4.2, 10.4), sx = lerp(W * 1.05, W * 0.55, sp), sy = lerp(H * 0.5, -H * 0.05, Math.sin(sp * Math.PI * 0.5));
    const glare = g.createRadialGradient(sx, sy, 10, sx, sy, 900); glare.addColorStop(0, `rgba(255,236,200,${0.55 * sp})`); glare.addColorStop(1, 'rgba(255,200,120,0)');
    g.fillStyle = glare; g.fillRect(0, 0, W, H);
    g.fillStyle = `rgba(255,140,40,${0.16 * eio(sp)})`; g.fillRect(0, 0, W, H);
    // rising heat lines
    g.strokeStyle = `rgba(255,255,255,${0.12 * sp})`; g.lineWidth = 2;
    for (let k = 0; k < 9; k++) { g.beginPath(); const x0 = 980 + k * 95; for (let yy = H; yy > 240; yy -= 12) { const xx = x0 + Math.sin(yy * 0.025 + t * 3 + k) * 10; yy === H ? g.moveTo(xx, yy) : g.lineTo(xx, yy); } g.stroke(); }
    vignette(0.6);
    // big time-lapse readout
    const a = prog(t, 4.6, 5.3);
    if (a > 0) {
      const hour = lerp(9, 16, eio(sp)), hh = Math.floor(hour), mm = Math.floor((hour - hh) * 60 / 5) * 5;
      text(`${String(hh).padStart(2, '0')}:${String(mm).padStart(2, '0')}`, 120, 210, { size: 44, weight: 500, fam: 'Mono', color: '#fff', alpha: a });
      text('ROOFTOP · HOSTEL BLOCK A', 120, 150, { size: 20, weight: 650, color: 'rgba(255,255,255,.75)', ls: 4, alpha: a });
      const temp = lerp(24, 33, eio(prog(t, 5, 10.2)));
      text(temp.toFixed(1), 110, 920, { size: 220, weight: 700, color: '#fff', alpha: a, ls: -8 });
      font(220, 700); g.letterSpacing = '-8px'; const tw = g.measureText(temp.toFixed(1)).width;
      text('°C', 110 + tw + 18, 830, { size: 80, weight: 600, color: '#fff', alpha: a });
      text('tank water, by afternoon · illustration', 124, 980, { size: 24, weight: 500, color: 'rgba(255,255,255,.8)', alpha: a });
    }
    g.restore();
  }
  // the falling drop (before impact), with a short motion trail
  if (t < impact) {
    const p = prog(t, 0.2, impact), y = lerp(-120, surf - 34, ein(p) * 0.92 + p * 0.08);
    for (let k = 5; k >= 0; k--) drawDrop(cx, y - k * 26 * p, 26, 1 + p * 0.5, (k ? 0.08 : 1) * clamp(t * 3));
  }
  // surface line and splash
  if (t < 4.3) {
    const sa = clamp(t * 2) * (1 - prog(t, 3.4, 4.3));
    g.save(); g.globalAlpha = sa; g.strokeStyle = 'rgba(147,197,253,.5)'; g.lineWidth = 2; g.beginPath(); g.moveTo(0, surf); g.lineTo(W, surf); g.stroke(); g.restore();
    const st = t - impact;
    if (st > 0) {
      for (let k = 0; k < 6; k++) { const rp = prog(st, k * 0.12, 1.6 + k * 0.12); if (rp > 0 && rp < 1) { g.save(); g.globalAlpha = (1 - rp) * 0.9; g.strokeStyle = k % 2 ? C.light : '#fff'; g.lineWidth = 3 - k * 0.3; g.beginPath(); g.ellipse(cx, surf, 20 + eout(rp) * (700 + k * 120), (20 + eout(rp) * (700 + k * 120)) * 0.18, 0, 0, Math.PI * 2); g.stroke(); g.restore(); } }
      const r = rng(42);
      for (let i = 0; i < 90; i++) { // ballistic droplets: an explosive crown
        const ang = -Math.PI / 2 + (r() - 0.5) * 2.4, sp = 300 + r() * 900, life = 0.6 + r() * 0.9, sz = 2 + r() * 7;
        if (st > life) continue;
        const x = cx + Math.cos(ang) * sp * st, y = surf + Math.sin(ang) * sp * st + 0.5 * 1800 * st * st;
        if (y > surf + 4) continue;
        g.beginPath(); g.arc(x, y, sz * (1 - st / life * 0.5), 0, Math.PI * 2); g.fillStyle = `rgba(190,220,255,${1 - st / life})`; g.fill();
      }
      if (st < 0.25) { g.save(); g.globalAlpha = 1 - st / 0.25; const fl = g.createRadialGradient(cx, surf, 0, cx, surf, 260); fl.addColorStop(0, '#fff'); fl.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = fl; g.fillRect(cx - 300, surf - 300, 600, 600); g.restore(); }
    }
  }
  if (t > 10.2) { g.fillStyle = `rgba(4,7,12,${eio(prog(t, 10.2, 10.6))})`; g.fillRect(0, 0, W, H); }
});

// S2 PROBLEM: heat strips the chlorine away; the paper register only says "cleaned"; four questions it can't answer.
scene(10.6, 29.6, (t) => {
  bg('#06101F', C.ink);
  // tank cross-section with chlorine fading in the heat
  const tankA = 1 - eio(prog(t, 4.6, 5.6)), tx = lerp(560, 300, eio(prog(t, 4.6, 5.6))) ;
  if (tankA > 0) {
    g.save(); g.globalAlpha = tankA * clamp(t * 2);
    const x = tx - 330, y = 300, w = 660, h = 560;
    const heat = eio(prog(t, 0.8, 4.4));
    const hg = g.createLinearGradient(0, 120, 0, 520); hg.addColorStop(0, `rgba(245,158,11,${0.55 * heat})`); hg.addColorStop(1, 'rgba(245,158,11,0)'); g.fillStyle = hg; g.fillRect(x - 200, 60, w + 400, 520);
    rr(x, y, w, h, 40); g.strokeStyle = 'rgba(255,255,255,.35)'; g.lineWidth = 4; g.stroke();
    g.save(); rr(x, y, w, h, 40); g.clip();
    const wl = y + 120; g.beginPath(); g.moveTo(x, wl); for (let xx = x; xx <= x + w; xx += 10) g.lineTo(xx, wl + Math.sin(xx * 0.02 + t * 2.4) * 8); g.lineTo(x + w, y + h); g.lineTo(x, y + h); g.closePath();
    const wg = g.createLinearGradient(0, wl, 0, y + h); wg.addColorStop(0, `rgba(8,102,245,${0.55 - heat * 0.15})`); wg.addColorStop(1, 'rgba(6,40,110,.8)'); g.fillStyle = wg; g.fill();
    const r = rng(9);
    for (let i = 0; i < 70; i++) {
      const px = x + 40 + r() * (w - 80), py = wl + 40 + r() * (h - 180), fade = clamp(1 - (heat * 1.25 - r() * 0.35)), dx = Math.sin(t * 1.5 + i) * 10;
      if (fade <= 0) continue; g.beginPath(); g.arc(px + dx, py + Math.cos(t * 1.2 + i) * 8 - (1 - fade) * 60, 9, 0, Math.PI * 2); g.fillStyle = `rgba(20,184,166,${fade})`; g.fill();
    }
    g.restore();
    text('free chlorine', x + 30, y + h + 50, { size: 26, weight: 600, color: C.teal });
    text(`heat ${(24 + heat * 10).toFixed(0)} °C`, x + w - 30, y + h + 50, { size: 26, weight: 600, color: C.heat, align: 'right' });
    g.restore();
    rise('Heat speeds up', 1080, 470, t - 0.5, { size: 92 });
    rise('chlorine loss.', 1080, 580, t - 0.9, { size: 92, colors: [C.teal, C.teal] });
    text('Source: Water Research, 2024 review (doi:10.1016/j.watres.2024.121913)', 1084, 650, { size: 22, weight: 500, color: C.dim, alpha: clamp((t - 1.6) * 2) * tankA });
    if (tankA < 1) { g.fillStyle = `rgba(4,7,12,${1 - tankA})`; g.fillRect(1000, 360, 920, 330); }
  }
  // the paper register
  const regIn = spring(t - 5.0, 9, 0.8), regX = lerp(lerp(W + 600, W / 2, regIn), 520, eio(prog(t, 9.6, 10.6)));
  if (t > 5) {
    g.save(); g.translate(regX, 560); g.rotate(lerp(0.25, -0.04, regIn) + 0.01 * Math.sin(t)); const s = lerp(1, 0.78, eio(prog(t, 9.6, 10.6))); g.scale(s, s);
    g.shadowColor = 'rgba(0,0,0,.5)'; g.shadowBlur = 60; g.shadowOffsetY = 30; rr(-380, -260, 760, 520, 18); g.fillStyle = C.paper; g.fill(); g.shadowColor = 'transparent';
    for (let k = 0; k < 8; k++) { g.strokeStyle = 'rgba(8,102,245,.14)'; g.lineWidth = 2; g.beginPath(); g.moveTo(-380, -170 + k * 56); g.lineTo(380, -170 + k * 56); g.stroke(); }
    g.strokeStyle = 'rgba(220,38,38,.35)'; g.beginPath(); g.moveTo(-300, -260); g.lineTo(-300, 260); g.stroke();
    text('Tank A · Block A', -270, -190, { size: 40, weight: 700, color: '#0F172A' });
    text('12 March — drained and scrubbed.', -270, -120, { size: 38, fam: 'Serif', color: '#1E3A8A' });
    text('Signed, maintenance team', -270, -64, { size: 34, fam: 'Serif', color: '#475569' });
    const st = spring(t - 8.4, 18, 0.55);
    if (t > 8.4) { g.save(); g.translate(150, 110); g.rotate(-0.16); const ss = lerp(2.6, 1, clamp(st)); g.scale(ss, ss); g.globalAlpha = clamp((t - 8.4) * 6);
      rr(-170, -52, 340, 104, 14); g.lineWidth = 7; g.strokeStyle = '#15803D'; g.stroke(); text('CLEANED', 0, 22, { size: 60, weight: 800, color: '#15803D', align: 'center', ls: 8 }); g.restore(); }
    g.restore();
  }
  // four questions the register can't answer
  const Q = [['How warm is the water?', 10.0, C.heat, 'temp'], ['Is any chlorine left?', 11.9, C.teal, 'cl'], ['Who checked the work?', 13.6, C.light, 'who'], ['What did the lab find?', 15.4, '#C4B5FD', 'lab']];
  Q.forEach(([q, at, col, ic], i) => {
    if (t < at) return; const p = eout5(prog(t, at, at + 0.6)), y = 330 + i * 150;
    g.save(); g.globalAlpha = p; const x = 1010 + (1 - p) * 80;
    rr(x, y - 62, 90, 90, 24); g.fillStyle = col + '22'; g.fill(); g.strokeStyle = col; g.lineWidth = 3;
    const ix = x + 45, iy = y - 17;
    g.beginPath();
    if (ic === 'temp') { g.roundRect(ix - 7, iy - 30, 14, 42, 7); g.stroke(); g.beginPath(); g.arc(ix, iy + 18, 12, 0, Math.PI * 2); g.fillStyle = col; g.fill(); }

    if (kind === 'rank') { ['TANK-B · Medium', 'TANK-A · Urgent'].forEach((s, k) => { const sw = spring(lt - 0.5, 9, 0.7), yy = 330 + (k === 1 ? lerp(90, 0, sw) : lerp(0, 90, sw)); rr(x - 200, yy, 400, 70, 18); g.fillStyle = k === 1 ? 'rgba(239,68,68,.18)' : 'rgba(255,255,255,.06)'; g.fill(); text(s, x - 170, yy + 46, { size: 28, weight: 600, color: k === 1 ? '#FCA5A5' : C.muted }); }); }

    text(a, x, 640, { size: 56, weight: 700, align: 'center' }); text(b, x, 712, { size: 56, weight: 400, fam: 'Serif', align: 'center', color: C.light });

  });

      rr(-300, -70, 600, 140, 18); g.lineWidth = 8; g.strokeStyle = C.red; g.stroke(); text('SAFE TO DRINK', 0, 26, { size: 70, weight: 800, color: C.red, align: 'center', ls: 6 });
      const lp = eout(prog(lt, 1.8, 2.3)); g.beginPath(); g.moveTo(-330, 40); g.lineTo(-330 + 660 * lp, -40); g.lineWidth = 10; g.stroke(); g.restore(); }
    ['What was measured', 'What was done', 'What still needs doing'].forEach((s, k) => { const at = 3.2 + k * 0.9; rise(s, 380 + k * 580, 820, lt - at, { size: 40, weight: 600, align: 'center', color: k === 2 ? C.light : '#fff' }); });
  }
  vignette(0.5);
});

});

window.DURATION = 158.5;
